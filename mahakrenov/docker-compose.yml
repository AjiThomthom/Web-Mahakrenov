version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mahakrenov-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    networks:
      - network
    depends_on:
      - db

  webserver:
    image: nginx:alpine
    container_name: mahakrenov-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - network
#      - proxy_network

  db:
    image: postgres:17-alpine
    container_name: mahakrenov-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-mahakrenov_db}
      POSTGRES_USER: ${DB_USERNAME:-mahakrenov_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    networks:
      - network

networks:
#  proxy_network:
#    external: true
  network:
    driver: bridge

volumes:
  db_data:
